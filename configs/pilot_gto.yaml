# pilot_gto.yaml -- the same economics question on a trainable transfer.
#
# Companion to pilot_economics.yaml. Identical axes, controllers, budgets and
# price book; the only change is the mission. That is deliberate: it makes the
# pair a controlled comparison of the *mission design*, and isolates how much of
# the earlier result was a property of the propulsion and how much was an
# artifact of a transfer too long to train on.
#
#   propulsion-rl run --config configs/pilot_gto.yaml --workers 4
#   propulsion-rl analyze --sweep pilot_gto
#
# nep_kilopower is listed but will be excluded arithmetically: an 1,800 kg
# reactor inside a 3,000 kg spacecraft carrying 1,200 kg of payload leaves no
# propellant. The exclusion row is the point -- it is the mass budget refusing
# the pairing, not a silent gap in the results table.

name: pilot_gto
description: >
  Cost per kilogram delivered to GEO from a launcher GTO drop-off, by propulsion
  system, across scripted and learned controllers. Three seeds and a small
  training budget: a pilot, not a result to publish.

propulsion:
  - hall_hermes
  - hall_spt100
  - ion_next
  - ion_nstar
  - nep_kilopower

missions:
  - gto_geo_transfer

agents:
  - edelbaum
  - max_thrust
  - prograde
  - random
  - ppo
  - sac

cost_models:
  - reference

seeds: 3

train_steps: 40000
eval_interval: 20000
val_episodes: 1
eval_episodes: 2

report_policy: best
selection_metric: return

results_dir: results
workers: 4
save_telemetry: false
